# Input: {"question": "Do I need an umbrella in Lyon today?"}
# Needs ORKESTRA_LLM_API_KEY in the environment (expanded only for local files).
#
# A tool-using agent: one orkestra/agent, two tools, one budget. `orkestra
# compile workflow.yaml` prints the steps, transitions and operations it
# expands to; nothing is hidden. Every model call and every tool call is a
# task: stored, retried, inspectable, resumable.
kind: orkestra/secret
name: llm
spec:
  api_key: ${ORKESTRA_LLM_API_KEY}

---
kind: orkestra/auth/api_key
name: llm_auth
spec: {secret: llm, in: header, key_name: x-api-key}

---
kind: orkestra/workflow
name: weather_agent
spec:
  description: 'Answers a weather question for any city with live Open-Meteo data. Input: {"question": "..."}'
  initial_step: weather
  input: .

---
kind: orkestra/agent
name: weather
spec:
  provider: anthropic
  auth: llm_auth
  model: claude-sonnet-5-5
  max_tokens: 1024
  system: You answer weather questions. Use the tools for coordinates and forecasts; never guess them. Answer in one or two sentences.
  prompt: .input.question
  # The agent is a loop, so it needs a bound. The last allowed turn may not call
  # a tool: the model has to answer with what it has. A model that ignores that
  # is refused on the next turn, and on_exhausted says where the run goes.
  budget: {turns: 6, cost_usd: 0.05, wall_clock: 60s, on_exhausted: gave_up}
  tools:
    geocode:
      description: Find the latitude and longitude of a city.
      input_schema: {type: object, properties: {name: {type: string, description: "City name, e.g. Lyon"}}, required: [name]}
      operation: geocode
    forecast:
      description: Hourly precipitation probability (%) and temperature (C) for today at a location.
      input_schema: {type: object, properties: {latitude: {type: number}, longitude: {type: number}}, required: [latitude, longitude]}
      operation: forecast

---
# A tool error does not fail the run: it goes back to the model as the result.
kind: orkestra/operation/http
name: geocode
spec:
  method: GET
  disable_http_failure: true
  url: '"https://geocoding-api.open-meteo.com/v1/search?name=\(.input.name | @uri)&count=1"'

---
kind: orkestra/operation/http
name: forecast
spec:
  method: GET
  disable_http_failure: true
  url: '"https://api.open-meteo.com/v1/forecast?latitude=\(.input.latitude)&longitude=\(.input.longitude)&hourly=precipitation_probability,temperature_2m&forecast_days=1&timezone=auto"'

---
kind: orkestra/operation/pass
name: gave_up
spec:
  output: '{text: "I could not finish within my turn budget."}'

---
kind: orkestra/step
name: gave_up
spec: {operation: gave_up}
