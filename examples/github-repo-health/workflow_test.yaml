# Tests for examples/reference/github-repo-health/workflow.yaml
# Run: orkestra test workflow.yaml workflow_test.yaml

# =========================
# MOCKS
# =========================
---
kind: orkestra/test/mock/http
name: mock_repo_active
spec:
  request:
    method: GET
    target: /repos/torvalds/linux
  response:
    code: 200
    headers:
      - content-type: application/json
    body: |
      {
        "name": "linux",
        "full_name": "torvalds/linux",
        "archived": false,
        "stargazers_count": 182000,
        "pushed_at": "2026-04-29T00:00:00Z"
      }

---
kind: orkestra/test/mock/http
name: mock_repo_archived
spec:
  request:
    method: GET
    target: /repos/torvalds/linux
  response:
    code: 200
    headers:
      - content-type: application/json
    body: |
      {
        "name": "linux",
        "full_name": "torvalds/linux",
        "archived": true,
        "stargazers_count": 182000,
        "pushed_at": "2024-01-01T00:00:00Z"
      }

---
kind: orkestra/test/mock/http
name: mock_issues_few
spec:
  request:
    method: GET
    target: /repos/torvalds/linux/issues
  response:
    code: 200
    headers:
      - content-type: application/json
    body: |
      [
        {"id": 1, "title": "Bug in scheduler", "state": "open"},
        {"id": 2, "title": "Memory leak in driver", "state": "open"}
      ]

---
