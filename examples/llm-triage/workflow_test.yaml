---
kind: orkestra/test/workflow
name: test_unclear_answer_takes_default_branch
spec:
  input: |
    {"title": "Some issue", "body": "Details"}
  phases:
    - name: triage
      mocks: [mock_llm_unclear, mock_result]
      expectations:
        - type: equal
          expected: 200
          actual: .steps.route_question.status_code
          failure: "default branch should run on an answer that is not bug or feature"
        - type: exactly
          expected: null
          actual: .steps.route_bug
          failure: "bug branch must not run"

---
kind: orkestra/test/workflow
name: test_refusal_goes_to_a_human
spec:
  input: |
    {"title": "Some issue", "body": "Details"}
  phases:
    - name: triage
      mocks: [mock_llm_refusal, mock_result]
      expectations:
        - type: equal
          expected: "llm.refusal"
          # .steps holds completed tasks only: a failed one is in .history.
          actual: '[.history[] | select(.step == "classify")][0].output._error.type'
          failure: "a refusal is a typed failure"
        - type: equal
          expected: "failed"
          actual: '[.history[] | select(.step == "classify")][0].status'
          failure: "the classify task failed"
        - type: equal
          expected: 200
          actual: .steps.route_question.status_code
          failure: "a refused call takes the question branch"
