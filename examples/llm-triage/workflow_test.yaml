# Run: ORKESTRA_LLM_API_KEY=test orkestra test workflow.yaml workflow_test.yaml
---
kind: orkestra/test/mock/http
name: mock_llm_bug
spec:
  request:
    method: POST
    target: /v1/messages
  response:
    code: 200
    headers:
      - content-type: application/json
    body: |
      {"model":"claude-sonnet-5-5","content":[{"type":"text","text":"bug"}],"stop_reason":"end_turn","usage":{"input_tokens":412,"output_tokens":2}}

---
kind: orkestra/test/mock/http
name: mock_llm_feature
spec:
  request:
    method: POST
    target: /v1/messages
  response:
    code: 200
    headers:
      - content-type: application/json
    body: |
      {"model":"claude-sonnet-5-5","content":[{"type":"text","text":"feature"}],"stop_reason":"end_turn","usage":{"input_tokens":412,"output_tokens":2}}

---
kind: orkestra/test/mock/http
name: mock_llm_question
spec:
  request:
    method: POST
    target: /v1/messages
  response:
    code: 200
    headers:
      - content-type: application/json
    body: |
      {"model":"claude-sonnet-5-5","content":[{"type":"text","text":"question"}],"stop_reason":"end_turn","usage":{"input_tokens":412,"output_tokens":2}}

---
kind: orkestra/test/mock/http
name: mock_llm_unclear
spec:
  request:
    method: POST
    target: /v1/messages
  response:
    code: 200
    headers:
      - content-type: application/json
    body: |
      {"model":"claude-sonnet-5-5","content":[{"type":"text","text":"I am not sure."}],"stop_reason":"end_turn","usage":{"input_tokens":412,"output_tokens":8}}

---
kind: orkestra/test/mock/http
name: mock_llm_refusal
spec:
  request:
    method: POST
    target: /v1/messages
  response:
    code: 200
    headers:
      - content-type: application/json
    body: |
      {"model":"claude-sonnet-5-5","content":[],"stop_reason":"refusal","stop_details":{"type":"refusal","category":"cyber","explanation":"declined"},"usage":{"input_tokens":412,"output_tokens":0}}

---
kind: orkestra/test/mock/http
name: mock_result
spec:
  request:
    method: POST
    target: /your-token-here
  response:
    code: 200
    headers:
      - content-type: application/json
    body: |
      {"ok": true}

---
kind: orkestra/test/workflow
name: test_bug_branch
spec:
  input: |
    {"title": "Some issue", "body": "Details"}
  phases:
    - name: triage
      mocks: [mock_llm_bug, mock_result]
      expectations:
        - type: equal
          expected: 200
          actual: .steps.route_bug.status_code
          failure: "bug branch should run"
        - type: exactly
          expected: null
          actual: .steps.route_feature
          failure: "other branches must not run"
        - type: equal
          expected: "bug"
          actual: .steps.classify.text
          failure: "the model text is the step output"
        - type: equal
          expected: 0.000844
          actual: .steps.classify.cost_usd
          failure: "412 input tokens at 2 USD and 2 output tokens at 10 USD per million"

---
kind: orkestra/test/workflow
name: test_feature_branch
spec:
  input: |
    {"title": "Some issue", "body": "Details"}
  phases:
    - name: triage
      mocks: [mock_llm_feature, mock_result]
      expectations:
        - type: equal
          expected: 200
          actual: .steps.route_feature.status_code
          failure: "feature branch should run"
        - type: exactly
          expected: null
          actual: .steps.route_bug
          failure: "other branches must not run"

---
kind: orkestra/test/workflow
name: test_question_branch
spec:
  input: |
    {"title": "Some issue", "body": "Details"}
  phases:
    - name: triage
      mocks: [mock_llm_question, mock_result]
      expectations:
        - type: equal
          expected: 200
          actual: .steps.route_question.status_code
          failure: "question branch should run"
        - type: exactly
          expected: null
